name: Build and Deploy to IBM OpenShift

on:
  push:
    branches: [main, homolog]
  workflow_dispatch: # Permite executar manualmente via GitHub Actions UI

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud version

      - name: Install Container Registry plugin
        run: |
          ibmcloud plugin install container-registry -f

      - name: Login to IBM Cloud
        env:
          IBMCLOUD_VERSION_CHECK: false
        run: |
          ibmcloud login --apikey ${{ secrets.IBM_CLOUD_API_KEY }} -r us-south
          ibmcloud cr region-set us-south
          ibmcloud cr login

      - name: Determine registry & environment
        id: config
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "registry=code-engine-senac-prod" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "namespace=prod-senac-orquestrator-chatbotx" >> $GITHUB_OUTPUT
            echo "prefix=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/homolog" ]] || [[ "${{ github.base_ref }}" == "homolog" ]]; then
            echo "registry=code-engine-senac-teste" >> $GITHUB_OUTPUT
            echo "environment=homologation" >> $GITHUB_OUTPUT
            echo "namespace=hml-senac-orquestrator-chatbotx" >> $GITHUB_OUTPUT
            echo "prefix=hml" >> $GITHUB_OUTPUT
          else
            echo "registry=code-engine-senac-dev" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "namespace=hml-senac-orquestrator-chatbotx" >> $GITHUB_OUTPUT
            echo "prefix=hml" >> $GITHUB_OUTPUT
          fi

      - name: Prune old images (free quota before push)
        run: |
          REGISTRY="${{ steps.config.outputs.registry }}"
          KEEP=2
          REPO="senac-from-scratch-multiagent"
          
          echo "📊 Quota atual:"
          ibmcloud cr quota || true
          
          cleanup_images() {
            local namespace="$1"
            local repo="$2"
            local keep="$3"
            
            echo ""
            echo "🔍 Limpando $namespace/$repo (mantendo $keep + latest)..."
            list=$(ibmcloud cr image-list --restrict "$namespace/$repo" --format "{{.Created}} {{.Repository}}:{{.Tag}}" 2>/dev/null | grep -v ":latest$" | sort | awk '{print $2}' || true)
            
            if [ -z "$list" ]; then
              echo "  Nenhuma imagem SHA encontrada."
              return
            fi
            
            count=$(echo "$list" | wc -l | tr -d ' ')
            echo "  Total de imagens SHA: $count"
            
            if [ "$count" -gt "$keep" ]; then
              to_delete_count=$((count - keep))
              echo "  🗑️ Removendo $to_delete_count imagens antigas..."
              echo "$list" | head -n "$to_delete_count" | while read -r img; do
                [ -z "$img" ] && continue
                echo "    Removendo: $img"
                ibmcloud cr image-rm "$img" 2>&1 || true
              done
            else
              echo "  ✅ Dentro do limite."
            fi
          }
          
          cleanup_images "$REGISTRY" "$REPO" "$KEEP"

      - name: Build and push image
        run: |
          REGISTRY="${{ steps.config.outputs.registry }}"
          IMAGE_NAME="us.icr.io/${REGISTRY}/senac-from-scratch-multiagent"
          
          docker build -t ${IMAGE_NAME}:latest \
                       -t ${IMAGE_NAME}:${{ github.sha }} .
          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Install Kubernetes Service plugin
        run: |
          ibmcloud plugin install kubernetes-service -f

      - name: Login to OpenShift via IBM Cloud
        run: |
          ibmcloud target -g RG-Senac

          max_attempts=5
          attempt=1
          while true; do
            echo "Tentativa $attempt/$max_attempts: ibmcloud oc cluster config"
            if ibmcloud oc cluster config --cluster OCP-Senac --admin; then
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "❌ Falha ao configurar acesso ao cluster OpenShift após $max_attempts tentativas."
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "Aguardando ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            ibmcloud target -g RG-Senac || true
            attempt=$((attempt + 1))
          done
          
          oc whoami
          oc project

      - name: Apply OpenShift manifests
        run: |
          ENV="${{ steps.config.outputs.environment }}"
          if [ "$ENV" == "production" ]; then
            oc apply -f openshift/prod/service.yaml -f openshift/prod/route.yaml -f openshift/prod/deployment.yaml
          else
            oc apply -f openshift/service.yaml -f openshift/route.yaml -f openshift/deployment.yaml
          fi

      - name: Rollout restart
        run: |
          NS="${{ steps.config.outputs.namespace }}"
          PREFIX="${{ steps.config.outputs.prefix }}"
          DEPLOYMENT="${PREFIX}-senac-from-scratch-multiagent"

          echo "Reiniciando $DEPLOYMENT no namespace $NS..."
          oc rollout restart deployment/"$DEPLOYMENT" -n "$NS"
          oc rollout status deployment/"$DEPLOYMENT" -n "$NS" --timeout=180s
